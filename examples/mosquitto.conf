# Learning config for the MQTT guide's lab broker.
# Run it in a terminal with:  mosquitto -c mosquitto.conf -v
#
# On an installed system you would instead drop these lines into
# /etc/mosquitto/conf.d/local.conf and restart the service, because
# the packaged /etc/mosquitto/mosquitto.conf includes that directory.

# Listen on the standard MQTT port, on this machine only.
# 127.0.0.1 means "this computer" — nothing on the network can
# reach this broker until you say so.
listener 1883 127.0.0.1

# Let clients connect without a username and password.
# Fine for learning on a locked-down listener like the one above.
# The guide's Keeping It Private chapter turns this off.
allow_anonymous true
